[[IgnoredVulns]]
id = "GHSA-7w5x-hrqm-74c2"
reason = "smol-toml parse() is only invoked when the 'config' input explicitly points to a .toml file. Auto-discovery in markdownlint-cli2 does not include .toml files (.markdownlint-cli2.jsonc/.yaml/.cjs/.mjs only), so default usage of this action never reaches the vulnerable code path. Upstream fix not yet available: markdownlint-cli2@0.23.2 (latest) still pins smol-toml@1.7.0 and no patched release exists. To be revisited once markdownlint-cli2 releases with smol-toml>=1.7.1."

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
reason = "katex is a transitive dependency of markdownlint-cli2 but is not bundled into dist/index.mjs (confirmed: ncc does not include it). The action never invokes katex code paths, so this vulnerability is not reachable at runtime."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch is a dev dependency only (used during build/lint) and is not shipped in dist/index.mjs. It is not present in the action's runtime environment."
